name: IndexNow

# Notify IndexNow (Bing, Yandex, etc.) when published pages change.
# The site is a Next.js app deployed on Vercel; this job maps changed source
# files (MDX posts and route files) to their public URLs and submits them.
# IndexNow only notifies — crawlers fetch the URLs later, by which point Vercel
# has finished deploying the push.

on:
  push:
    branches: [main]
    paths:
      - "content/blog/**"
      - "src/app/**"
      - "src/components/**"

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the previous commit to diff against

      - name: Submit changed pages to IndexNow
        env:
          HOST: patrickserrano.com
          # GitHub-provided commit SHAs — passed via env (not interpolated into
          # the script body) per GitHub Actions injection-safety guidance.
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Single source of truth for the key: the 32-hex .txt file in public/.
          KEY_FILE=$(find public -maxdepth 1 -type f -regextype posix-extended \
            -regex '.*/[0-9a-f]{32}\.txt' -printf '%f\n' | head -n1)
          if [ -z "${KEY_FILE:-}" ]; then
            echo "No IndexNow key file (public/<32-hex>.txt) found; skipping."
            exit 0
          fi
          KEY="${KEY_FILE%.txt}"

          # Files changed by this push. Fall back to HEAD~1 when 'before' is
          # unavailable (first push / force push / new branch).
          BEFORE="$BEFORE_SHA"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -n "$BEFORE" ]; then
            CHANGED=$(git diff --name-only --diff-filter=ACM "$BEFORE" "$AFTER_SHA")
          else
            CHANGED=$(git ls-files)
          fi

          # Map changed source files to public URLs (deduped).
          declare -A seen
          urls=()
          add_url() {
            local u="$1"
            if [ -z "${seen[$u]:-}" ]; then
              seen[$u]=1
              urls+=("$u")
            fi
          }

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              content/blog/*.mdx)
                slug="${f#content/blog/}"; slug="${slug%.mdx}"
                add_url "https://${HOST}/blog/${slug}"
                add_url "https://${HOST}/blog" ;;
              src/app/page.tsx)
                add_url "https://${HOST}/" ;;
              src/app/resume/*)
                add_url "https://${HOST}/resume" ;;
              src/app/blog/page.tsx)
                add_url "https://${HOST}/blog" ;;
              # Shared layout / components / global styles touch every page.
              src/app/layout.tsx|src/app/globals.css|src/components/*)
                add_url "https://${HOST}/"
                add_url "https://${HOST}/resume"
                add_url "https://${HOST}/blog" ;;
            esac
          done <<< "$CHANGED"

          if [ "${#urls[@]}" -eq 0 ]; then
            echo "No published pages affected; nothing to submit."
            exit 0
          fi

          # Build the JSON payload.
          url_json=$(printf '"%s",' "${urls[@]}")
          url_json="[${url_json%,}]"
          payload=$(cat <<EOF
          {
            "host": "${HOST}",
            "key": "${KEY}",
            "keyLocation": "https://${HOST}/${KEY_FILE}",
            "urlList": ${url_json}
          }
          EOF
          )

          echo "Submitting to IndexNow:"
          printf '  %s\n' "${urls[@]}"

          code=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload")

          echo "IndexNow responded: HTTP $code"
          cat /tmp/indexnow.out || true
          echo
          # 200 = OK, 202 = Accepted (key validation pending). Both are success.
          case "$code" in
            200|202) echo "Success." ;;
            *) echo "IndexNow submission failed."; exit 1 ;;
          esac
