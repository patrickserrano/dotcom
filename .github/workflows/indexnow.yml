name: IndexNow

# Notify IndexNow (Bing, Yandex, etc.) when published pages change.
# The site is a Next.js app deployed on Vercel and served from two domains
# during the name change, so every changed path is submitted once per host.
# This job maps changed source files (MDX posts and route files) to paths.
# IndexNow only notifies — crawlers fetch the URLs later, by which point Vercel
# has finished deploying the push.

on:
  push:
    branches: [main]
    paths:
      - "content/blog/**"
      - "src/app/**"
      - "src/components/**"
      - "src/lib/**" # site.ts drives every page title and description

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the previous commit to diff against

      - name: Submit changed pages to IndexNow
        env:
          # Both domains serve the same content while the name change is in
          # progress; each is a separate IndexNow host.
          HOSTS: "patrickserrano.com patrickpowers.dev"
          # GitHub-provided commit SHAs — passed via env (not interpolated into
          # the script body) per GitHub Actions injection-safety guidance.
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Single source of truth for the key: the 32-hex .txt file in public/.
          KEY_FILE=$(find public -maxdepth 1 -type f -regextype posix-extended \
            -regex '.*/[0-9a-f]{32}\.txt' -printf '%f\n' | head -n1)
          if [ -z "${KEY_FILE:-}" ]; then
            echo "No IndexNow key file (public/<32-hex>.txt) found; skipping."
            exit 0
          fi
          KEY="${KEY_FILE%.txt}"

          # Files changed by this push. Fall back to HEAD~1 when 'before' is
          # unavailable (first push / force push / new branch).
          BEFORE="$BEFORE_SHA"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -n "$BEFORE" ]; then
            CHANGED=$(git diff --name-only --diff-filter=ACM "$BEFORE" "$AFTER_SHA")
          else
            CHANGED=$(git ls-files)
          fi

          # Map changed source files to site-relative paths (deduped).
          declare -A seen
          paths=()
          add_path() {
            local p="$1"
            if [ -z "${seen[$p]:-}" ]; then
              seen[$p]=1
              paths+=("$p")
            fi
          }

          # /blog and its posts only exist once a post does; the route 404s
          # otherwise, so never submit them for an empty blog.
          has_posts=false
          if compgen -G "content/blog/*.mdx" > /dev/null; then
            has_posts=true
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              content/blog/*.mdx)
                if [ "$has_posts" = true ]; then
                  slug="${f#content/blog/}"; slug="${slug%.mdx}"
                  add_path "/blog/${slug}"
                  add_path "/blog"
                fi ;;
              src/app/page.tsx)
                add_path "/" ;;
              src/app/resume/*)
                add_path "/resume" ;;
              src/app/blog/page.tsx)
                [ "$has_posts" = true ] && add_path "/blog" ;;
              # Shared layout / components / config touch every page.
              src/app/layout.tsx|src/app/globals.css|src/components/*|src/lib/*)
                add_path "/"
                add_path "/resume"
                [ "$has_posts" = true ] && add_path "/blog" ;;
            esac
          done <<< "$CHANGED"

          if [ "${#paths[@]}" -eq 0 ]; then
            echo "No published pages affected; nothing to submit."
            exit 0
          fi

          # Submit the same set of paths to each host in turn.
          failed=0
          for HOST in $HOSTS; do
            url_json=$(printf "\"https://${HOST}%s\"," "${paths[@]}")
            url_json="[${url_json%,}]"
            payload=$(cat <<EOF
          {
            "host": "${HOST}",
            "key": "${KEY}",
            "keyLocation": "https://${HOST}/${KEY_FILE}",
            "urlList": ${url_json}
          }
          EOF
            )

            echo "Submitting to IndexNow for ${HOST}:"
            printf "  https://${HOST}%s\n" "${paths[@]}"

            code=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' \
              -X POST "https://api.indexnow.org/IndexNow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "$payload")

            echo "IndexNow responded for ${HOST}: HTTP $code"
            cat /tmp/indexnow.out || true
            echo
            # 200 = OK, 202 = Accepted (key validation pending). Both succeed.
            case "$code" in
              200|202) echo "Success for ${HOST}." ;;
              # Keep going so one bad host cannot suppress the other.
              *) echo "IndexNow submission failed for ${HOST}."; failed=1 ;;
            esac
          done

          exit "$failed"
